[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chan2pdf"
version = "0.1.0"
description = "Archive an imageboard thread as a PDF with full-resolution images and clickable links between posts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "httpx>=0.27",
    "pillow>=10.0",
    "weasyprint>=62.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pypdf>=4.0", "ruff>=0.5"]

[project.scripts]
4chan2pdf = "chan2pdf.cli:main"
chan2pdf = "chan2pdf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chan2pdf = ["*.css"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
